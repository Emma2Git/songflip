<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>SongFlip</title>
<style>
  :root {
    --bg: #000;
    --rot: #ea352d;
    --gruen: #5cc858;
    --blau: #4facea;
    --gelb: #f2b632;
    --text: #fff;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Rounded", "Segoe UI", Roboto, sans-serif;
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
  }
  .app {
    height: 100%;
    display: flex;
    flex-direction: column;
    padding: calc(env(safe-area-inset-top, 0px) + 12px) 16px calc(env(safe-area-inset-bottom, 0px) + 16px);
    gap: 12px;
  }
  h1 {
    margin: 0;
    text-align: center;
    font-size: 20px;
    font-weight: 700;
    padding: 6px 0 4px;
  }
  .btn {
    flex: 1;
    min-height: 0;
    border: 0;
    border-radius: 44px;
    color: var(--text);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    font: inherit;
    font-size: clamp(20px, 5.6vw, 30px);
    font-weight: 700;
    cursor: pointer;
    transition: transform .12s ease, opacity .2s ease, filter .2s ease;
  }
  .btn:active:not(:disabled) { transform: scale(.97); }
  .btn:disabled { opacity: .35; cursor: default; }
  .btn svg { width: clamp(34px, 8.5vw, 52px); height: auto; fill: #fff; }
  .rot { background: var(--rot); }
  .gruen { background: var(--gruen); }
  .blau { background: var(--blau); }
  .gelb { background: var(--gelb); }
  .btn:focus-visible { outline: 4px solid #fff; outline-offset: 3px; }
  .rot.aktiv { animation: puls 1.1s ease-in-out infinite; }
  @keyframes puls {
    0%, 100% { filter: brightness(1); }
    50% { filter: brightness(1.25); }
  }
  .status {
    min-height: 22px;
    text-align: center;
    font-size: 15px;
    color: #9a9a9a;
  }
  @media (prefers-reduced-motion: reduce) {
    .rot.aktiv { animation: none; }
  }
</style>
</head>
<body>
<div class="app">
  <h1>SongFlip</h1>

  <button id="rec" class="btn rot" type="button">
    <svg viewBox="0 0 24 24" id="recIcon" aria-hidden="true">
      <path d="M12 14a3.5 3.5 0 0 0 3.5-3.5V5.5a3.5 3.5 0 0 0-7 0v5A3.5 3.5 0 0 0 12 14zm6-3.5a1 1 0 1 0-2 0 4 4 0 0 1-8 0 1 1 0 1 0-2 0 6 6 0 0 0 5 5.9V19H9a1 1 0 1 0 0 2h6a1 1 0 1 0 0-2h-2v-2.6a6 6 0 0 0 5-5.9z"/>
    </svg>
    <span id="recText">Aufnahme starten</span>
  </button>

  <button id="play" class="btn gruen" type="button" disabled>
    <svg viewBox="0 0 24 24" id="playIcon" aria-hidden="true">
      <path d="M8 5.2v13.6a1 1 0 0 0 1.5.86l11-6.8a1 1 0 0 0 0-1.72l-11-6.8A1 1 0 0 0 8 5.2z"/>
    </svg>
    <span id="playText">Aufnahme abspielen</span>
  </button>

  <button id="rev" class="btn blau" type="button" disabled>
    <svg viewBox="0 0 24 24" id="revIcon" aria-hidden="true">
      <path d="M16 5.2v13.6a1 1 0 0 1-1.5.86l-11-6.8a1 1 0 0 1 0-1.72l11-6.8A1 1 0 0 1 16 5.2z"/>
    </svg>
    <span id="revText">Rückwärts abspielen</span>
  </button>

  <button id="prev" class="btn gelb" type="button" disabled>
    <svg viewBox="0 0 24 24" id="prevIcon" aria-hidden="true">
      <path d="M16 5.2v13.6a1 1 0 0 1-1.5.86l-11-6.8a1 1 0 0 1 0-1.72l11-6.8A1 1 0 0 1 16 5.2z"/>
    </svg>
    <span id="prevText">Vorherige rückwärts</span>
  </button>

  <div class="status" id="status" role="status" aria-live="polite"></div>
</div>

<script>
(() => {
  const MAX_SEKUNDEN = 60;

  const recBtn = document.getElementById('rec');
  const playBtn = document.getElementById('play');
  const revBtn = document.getElementById('rev');
  const recText = document.getElementById('recText');
  const playText = document.getElementById('playText');
  const revText = document.getElementById('revText');
  const prevBtn = document.getElementById('prev');
  const prevText = document.getElementById('prevText');
  const statusEl = document.getElementById('status');

  const ICON_STOP = '<path d="M7 6h10a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1z"/>';
  const ICON_MIC = document.getElementById('recIcon').innerHTML;
  const ICON_PLAY = document.getElementById('playIcon').innerHTML;
  const ICON_REV = document.getElementById('revIcon').innerHTML;

  let ctx = null;
  let stream = null;
  let recorder = null;
  let chunks = [];
  let timer = null;
  let buffer = null;          // Original-Aufnahme
  let reverseBuffer = null;   // umgedrehte Aufnahme
  let vorherigeRev = null;    // umgedrehte Aufnahme der Runde davor
  let source = null;
  let state = 'bereit';       // bereit | aufnahme | verarbeiten | fertig
  let playing = null;         // null | 'vor' | 'rueck'

  function setStatus(t) { statusEl.textContent = t || ''; }

  function getCtx() {
    if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }

  function ui() {
    const rec = state === 'aufnahme';
    recBtn.classList.toggle('aktiv', rec);
    recText.textContent = rec ? 'Aufnahme beenden' : 'Aufnahme starten';
    document.getElementById('recIcon').innerHTML = rec ? ICON_STOP : ICON_MIC;
    recBtn.disabled = state === 'verarbeiten';

    const hat = state === 'fertig' && buffer;
    playBtn.disabled = !hat;
    revBtn.disabled = !hat;

    playText.textContent = playing === 'vor' ? 'Stopp' : 'Aufnahme abspielen';
    document.getElementById('playIcon').innerHTML = playing === 'vor' ? ICON_STOP : ICON_PLAY;
    revText.textContent = playing === 'rueck' ? 'Stopp' : 'Rückwärts abspielen';
    document.getElementById('revIcon').innerHTML = playing === 'rueck' ? ICON_STOP : ICON_REV;

    prevBtn.disabled = !vorherigeRev || state === 'aufnahme' || state === 'verarbeiten';
    prevText.textContent = playing === 'vorher' ? 'Stopp' : 'Vorherige rückwärts';
    document.getElementById('prevIcon').innerHTML = playing === 'vorher' ? ICON_STOP : ICON_REV;
  }

  function stopPlayback() {
    if (source) {
      source.onended = null;
      try { source.stop(); } catch (e) {}
      source.disconnect();
      source = null;
    }
    playing = null;
  }

  function resetAlles() {
    stopPlayback();
    if (reverseBuffer) vorherigeRev = reverseBuffer;  // letzte Runde merken
    buffer = null;
    reverseBuffer = null;
    chunks = [];
  }

  function releaseMic() {
    if (stream) {
      stream.getTracks().forEach(t => t.stop());
      stream = null;
    }
  }

  async function startRecording() {
    resetAlles();
    const c = getCtx();
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch (err) {
      state = 'bereit';
      ui();
      setStatus('Kein Zugriff aufs Mikrofon. Bitte in den Browser-Einstellungen erlauben.');
      return;
    }
    recorder = new MediaRecorder(stream);
    recorder.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
    recorder.onstop = finishRecording;
    recorder.start();
    state = 'aufnahme';
    ui();
    setStatus('Es wird aufgenommen …');
    timer = setTimeout(() => { if (state === 'aufnahme') stopRecording(); }, MAX_SEKUNDEN * 1000);
  }

  function stopRecording() {
    clearTimeout(timer);
    if (recorder && recorder.state !== 'inactive') {
      state = 'verarbeiten';
      ui();
      setStatus('Wird verarbeitet …');
      recorder.stop();
    }
  }

  async function finishRecording() {
    releaseMic();
    try {
      const blob = new Blob(chunks, { type: (recorder && recorder.mimeType) || 'audio/mp4' });
      const arr = await blob.arrayBuffer();
      const c = getCtx();
      buffer = await new Promise((res, rej) => c.decodeAudioData(arr, res, rej));
      reverseBuffer = makeReverse(c, buffer);
      state = 'fertig';
      setStatus('Fertig. Du kannst jetzt abspielen.');
    } catch (e) {
      buffer = null;
      reverseBuffer = null;
      state = 'bereit';
      setStatus('Die Aufnahme hat nicht geklappt. Bitte nochmal versuchen.');
    }
    chunks = [];
    ui();
  }

  function makeReverse(c, buf) {
    const out = c.createBuffer(buf.numberOfChannels, buf.length, buf.sampleRate);
    for (let ch = 0; ch < buf.numberOfChannels; ch++) {
      const data = new Float32Array(buf.getChannelData(ch));
      data.reverse();
      out.copyToChannel(data, ch);
    }
    return out;
  }

  function play(richtung) {
    const c = getCtx();
    const was = playing;
    stopPlayback();
    if (was === richtung) { ui(); setStatus(''); return; }  // zweites Tippen = Stopp
    const buf = richtung === 'vor' ? buffer : richtung === 'rueck' ? reverseBuffer : vorherigeRev;
    if (!buf) return;
    source = c.createBufferSource();
    source.buffer = buf;
    source.connect(c.destination);
    source.onended = () => { source = null; playing = null; ui(); setStatus(''); };
    source.start();
    playing = richtung;
    ui();
    setStatus(richtung === 'vor' ? 'Wird abgespielt …' : richtung === 'rueck' ? 'Wird rückwärts abgespielt …' : 'Vorherige Runde wird rückwärts abgespielt …');
  }

  recBtn.addEventListener('click', () => {
    if (state === 'aufnahme') stopRecording();
    else if (state === 'bereit' || state === 'fertig') {
      state = 'bereit';
      startRecording();
    }
  });
  playBtn.addEventListener('click', () => play('vor'));
  revBtn.addEventListener('click', () => play('rueck'));
  prevBtn.addEventListener('click', () => play('vorher'));

  if (!navigator.mediaDevices || !window.MediaRecorder) {
    setStatus('Dieser Browser unterstützt keine Aufnahme.');
    recBtn.disabled = true;
  }
  ui();
})();
</script>
</body>
</html>
